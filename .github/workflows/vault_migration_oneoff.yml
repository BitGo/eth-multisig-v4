# One-time migration of the 7 non-rotatable deployer private keys into
# Vault, so eth-multisig-v4-private can eventually read them from there
# instead of this repo's GitHub Actions secrets. See INF-4222.
#
# This workflow should be deleted, and the matching Vault grant in
# BitGo/infra revoked, in the same day the run below succeeds. There is
# no ongoing reason for this repo to hold any Vault access.
#
# Manual trigger only. The "vault-migration-oneoff" GitHub environment
# requires approval from ecosystem-directors and git-admins before this
# can run, and Vault's own JWT auth role additionally requires the OIDC
# token to carry that exact environment claim, so the review gate is
# enforced on both sides, not just by GitHub's UI.
name: One-time Vault migration (deployer keys)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  migrate-deployer-keys-to-vault:
    runs-on: ubuntu-latest
    environment: vault-migration-oneoff
    steps:
      - name: Validate all 7 secrets are present
        env:
          MAINNET_PRIVATE_KEY_FOR_CONTRACT_DEPLOYMENT: ${{ secrets.MAINNET_PRIVATE_KEY_FOR_CONTRACT_DEPLOYMENT }}
          TESTNET_PRIVATE_KEY_FOR_CONTRACT_DEPLOYMENT: ${{ secrets.TESTNET_PRIVATE_KEY_FOR_CONTRACT_DEPLOYMENT }}
          PRIVATE_KEY_FOR_V1_WALLET_CONTRACT_DEPLOYMENT: ${{ secrets.PRIVATE_KEY_FOR_V1_WALLET_CONTRACT_DEPLOYMENT }}
          PRIVATE_KEY_FOR_V4_CONTRACT_DEPLOYMENT: ${{ secrets.PRIVATE_KEY_FOR_V4_CONTRACT_DEPLOYMENT }}
          PRIVATE_KEY_FOR_V4_CONTRACT_DEPLOYMENT_BACKUP: ${{ secrets.PRIVATE_KEY_FOR_V4_CONTRACT_DEPLOYMENT_BACKUP }}
          PRIVATE_KEY_FOR_BATCHER_CONTRACT_DEPLOYMENT: ${{ secrets.PRIVATE_KEY_FOR_BATCHER_CONTRACT_DEPLOYMENT }}
          HYPE_EVM_PRIVATE_KEY: ${{ secrets.HYPE_EVM_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in MAINNET_PRIVATE_KEY_FOR_CONTRACT_DEPLOYMENT \
                      TESTNET_PRIVATE_KEY_FOR_CONTRACT_DEPLOYMENT \
                      PRIVATE_KEY_FOR_V1_WALLET_CONTRACT_DEPLOYMENT \
                      PRIVATE_KEY_FOR_V4_CONTRACT_DEPLOYMENT \
                      PRIVATE_KEY_FOR_V4_CONTRACT_DEPLOYMENT_BACKUP \
                      PRIVATE_KEY_FOR_BATCHER_CONTRACT_DEPLOYMENT \
                      HYPE_EVM_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error ::$name is empty, aborting before requesting any Vault token"
              exit 1
            fi
          done
          echo "All 7 secrets present."

      - name: Authenticate to Vault
        id: vault-auth
        uses: hashicorp/vault-action@4c06c5ccf5c0761b6029f56cfb1dcf5565918a3b # v3.4.0
        with:
          url: https://vault.bitgo-int.com
          path: github/jwt
          method: jwt
          role: eth-multisig-v4-vault-migration
          jwtGithubAudience: https://github.com/BitGo
          exportToken: true

      - name: Write deployer keys to Vault
        env:
          VAULT_ADDR: https://vault.bitgo-int.com
          VAULT_TOKEN: ${{ steps.vault-auth.outputs.token }}
          MAINNET_PRIVATE_KEY_FOR_CONTRACT_DEPLOYMENT: ${{ secrets.MAINNET_PRIVATE_KEY_FOR_CONTRACT_DEPLOYMENT }}
          TESTNET_PRIVATE_KEY_FOR_CONTRACT_DEPLOYMENT: ${{ secrets.TESTNET_PRIVATE_KEY_FOR_CONTRACT_DEPLOYMENT }}
          PRIVATE_KEY_FOR_V1_WALLET_CONTRACT_DEPLOYMENT: ${{ secrets.PRIVATE_KEY_FOR_V1_WALLET_CONTRACT_DEPLOYMENT }}
          PRIVATE_KEY_FOR_V4_CONTRACT_DEPLOYMENT: ${{ secrets.PRIVATE_KEY_FOR_V4_CONTRACT_DEPLOYMENT }}
          PRIVATE_KEY_FOR_V4_CONTRACT_DEPLOYMENT_BACKUP: ${{ secrets.PRIVATE_KEY_FOR_V4_CONTRACT_DEPLOYMENT_BACKUP }}
          PRIVATE_KEY_FOR_BATCHER_CONTRACT_DEPLOYMENT: ${{ secrets.PRIVATE_KEY_FOR_BATCHER_CONTRACT_DEPLOYMENT }}
          HYPE_EVM_PRIVATE_KEY: ${{ secrets.HYPE_EVM_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          # Secrets are only ever referenced via env vars here, never as
          # CLI arguments or echoed to the log, and the response is piped
          # straight into a filter that keeps version metadata only. Vault
          # KV v2's write response never echoes back submitted data, so
          # there is nothing to redact even if this were printed in full.
          jq -n \
            --arg mainnet "$MAINNET_PRIVATE_KEY_FOR_CONTRACT_DEPLOYMENT" \
            --arg testnet "$TESTNET_PRIVATE_KEY_FOR_CONTRACT_DEPLOYMENT" \
            --arg v1_wallet "$PRIVATE_KEY_FOR_V1_WALLET_CONTRACT_DEPLOYMENT" \
            --arg v4 "$PRIVATE_KEY_FOR_V4_CONTRACT_DEPLOYMENT" \
            --arg v4_backup "$PRIVATE_KEY_FOR_V4_CONTRACT_DEPLOYMENT_BACKUP" \
            --arg batcher "$PRIVATE_KEY_FOR_BATCHER_CONTRACT_DEPLOYMENT" \
            --arg hype_evm "$HYPE_EVM_PRIVATE_KEY" \
            '{data: {mainnet: $mainnet, testnet: $testnet, v1_wallet: $v1_wallet, v4: $v4, v4_backup: $v4_backup, batcher: $batcher, hype_evm: $hype_evm}}' \
          | curl --fail --silent --show-error \
              --header "X-Vault-Token: ${VAULT_TOKEN}" \
              --request POST \
              --data @- \
              "${VAULT_ADDR}/v1/github/secret/data/eth-multisig-v4-private/deployer-key" \
          | jq '{version: .data.version, created_time: .data.created_time}'

          echo "Wrote eth-multisig-v4-private/deployer-key. Version shown above, not the key material."
